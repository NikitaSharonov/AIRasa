version: "3.1"

rules:

- rule: приветствие
  steps:
    - intent: greet
    - action: action_load_user_memory

- rule: прощание
  steps:
  - intent: goodbye
  - action: action_set_last_seen
  - action: action_sentiment_response

- rule: сохранение имени
  steps:
    - intent: inform_name
    - action: action_save_user_memory

- rule: время последнего взаимодействия
  steps:
    - intent: ask_last_seen
    - action: action_tell_last_seen

- rule: кто такой бот
  steps:
    - intent: ask_name
    - action: action_sentiment_response
    - action: utter_ask_name

- rule: узнать возможности
  steps:
    - intent: ask_abilities
    - action: action_sentiment_response
    - action: utter_ask_abilities

- rule: погода
  steps:
    - intent: ask_weather
    - action: action_sentiment_response
    - action: action_get_weather

- rule: узнать время
  steps:
    - intent: ask_time
    - action: action_sentiment_response
    - action: action_get_time

- rule: узнать дату
  steps:
    - intent: ask_date
    - action: action_sentiment_response
    - action: action_get_date

- rule: арифметика сложение
  steps:
    - intent: math_add
    - action: action_calculate

- rule: арифметика вычитание
  steps:
    - intent: math_subtract
    - action: action_calculate

- rule: арифметика умножение
  steps:
    - intent: math_multiply
    - action: action_calculate

- rule: арифметика деление
  steps:
    - intent: math_divide
    - action: action_calculate

- rule: поиск
  steps:
    - intent: search_query
    - action: action_sentiment_response
    - action: action_web_search

- rule: неизвестный запрос
  steps:
    - intent: unknown
    - action: action_sentiment_response
