version: "3.1"

intents:
  - greet
  - goodbye
  - ask_name
  - ask_abilities
  - ask_time
  - ask_date
  - math_add
  - math_subtract
  - math_multiply
  - math_divide
  - ask_weather
  - search_query
  - unknown
  - inform_name
  - ask_last_seen

entities:
  - city
  - name

slots:
  city:
    type: text
    mappings:
      - type: from_entity
        entity: city

  name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: name

  favorite_topic:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

responses:
  utter_ask_name:
    - text: "Я бот-помощник! Спроси меня что-нибудь."

  utter_ask_abilities:
    - text: "Я умею показывать погоду, время, делать расчёты и искать в Google."

actions:
  - action_get_time
  - action_get_date
  - action_calculate
  - action_get_weather
  - action_web_search
  - action_sentiment_response
  - action_load_user_memory
  - action_save_user_memory
  - action_set_last_seen
  - action_tell_last_seen

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
